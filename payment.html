<!DOCTYPE html>
<html>
<head>
	<title>Page Title</title>
</head>
<body>

<p><b>Choose your payment desire</b></p>
<form>
  <label for="cash">Cash</label>
  <input type="radio" id="cash" name="pay" value="cash" />
  <label for="creditCard">Credit Card</label>
  <input type="radio" id="creditCard" name="pay" value="creditCard" />
  <label for="stcpay">STC Pay</label>
  <input type="radio" id="stcpay" name="pay" value="stcpay" />
  <label for="paypal">PayPal</label>
  <input type="radio" id="paypal" name="pay" value="paypal" />
  <br>
  <input type="submit" />
</form>

</body>
</html>
